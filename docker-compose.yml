services:
  postgres:
    image: postgres:16-alpine
    container_name: if3110_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform_db
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/sample_db.sql:/docker-entrypoint-initdb.d/sample_db.sql

volumes:
  pgdata:

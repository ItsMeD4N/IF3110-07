receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include:
      - /var/log/if3110/*.log
    start_at: end
    include_file_name: true
    operators:
      - type: json_parser
        on_error: send
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
        severity:
          parse_from: attributes.level
      - type: trace_parser
        if: 'attributes.trace_id != nil and attributes.span_id != nil'
        trace_id:
          parse_from: attributes.trace_id
        span_id:
          parse_from: attributes.span_id
      - type: move
        if: 'attributes.msg != nil'
        from: attributes.msg
        to: body

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  resource/logs:
    attributes:
      - key: service.name
        value: if3110-db-platform
        action: insert
      - key: deployment.environment
        value: development
        action: insert
  batch:
    timeout: 2s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    logs:
      receivers: [filelog, otlp]
      processors: [memory_limiter, resource/logs, batch]
      exporters: [otlphttp/loki]

global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: if3110-server
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          component: server

  - job_name: if3110-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          component: worker

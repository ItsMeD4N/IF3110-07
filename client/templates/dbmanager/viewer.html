{{define "title"}}Viewer{{end}}
{{define "content"}}
{{$id := .Data.DatabaseID}}
<header class="page-header">
  <div>
    <p class="crumb"><a href="/databases/{{$id}}">Database</a> / Viewer</p>
    <h1>Viewer</h1>
    <p class="muted">Lihat struktur dan isi tabel.</p>
  </div>
  <a class="btn" href="/databases/{{$id}}/migrations">Migration</a>
</header>
<section class="card">
  <div class="form-row">
    <label for="schemaSelect">Schema</label>
    <select id="schemaSelect">
      <option>Memuat schema…</option>
    </select>
    <label for="tableSelect">Tabel</label>
    <select id="tableSelect">
      <option>Pilih tabel</option>
    </select>
    <button class="btn" id="loadTable" type="button">Lihat tabel</button>
  </div>
  <p id="viewerStatus" class="muted" role="status">Memuat metadata database…</p>
</section>
<section class="card">
  <h2>Struktur tabel</h2>
  <div id="tableMetadata">
    <p class="muted">Pilih tabel untuk melihat metadata.</p>
  </div>
</section>
<section class="card">
  <div class="page-header">
    <div>
      <h2>Data tabel</h2>
      <p id="dataSummary" class="muted"></p>
    </div>
    <div><button class="btn btn-secondary btn-sm" id="prevPage" type="button">Sebelumnya</button> <button
        class="btn btn-secondary btn-sm" id="nextPage" type="button">Berikutnya</button></div>
  </div>
  <div class="table-wrap" id="tableData">
    <p class="muted">Pilih tabel untuk melihat data.</p>
  </div>
</section>
<script>
  (() => {
    const dbID = Number("{{.Data.DatabaseID}}");
    const schemaSelect = document.getElementById('schemaSelect');
    const tableSelect = document.getElementById('tableSelect');
    const status = document.getElementById('viewerStatus');
    const metadata = document.getElementById('tableMetadata');
    const dataArea = document.getElementById('tableData');
    const summary = document.getElementById('dataSummary');
    let schemaInfo = null, offset = 0, total = 0, currentTable = '';
    const limit = 50;
    const el = (tag, text) => { const n = document.createElement(tag); if (text !== undefined) n.textContent = String(text); return n; };
    async function loadSchema() {
      try {
        const res = await fetch(`/api/databases/${dbID}/schema`);
        const data = await res.json(); if (!res.ok) throw new Error(data.message || data.error || 'Gagal memuat schema');
        schemaInfo = data; schemaSelect.replaceChildren();
        data.schemas.forEach(s => schemaSelect.add(new Option(s, s)));
        if (data.selected_schema) schemaSelect.value = data.selected_schema;
        await loadTables();
        status.textContent = `${data.schemas.length} schema ditemukan.`;
      } catch (e) { status.textContent = e.message; }
    }
    async function loadTables() {
      try {
        const res = await fetch(`/api/databases/${dbID}/schema?schema=${encodeURIComponent(schemaSelect.value)}`);
        const data = await res.json(); if (!res.ok) throw new Error(data.message || data.error || 'Gagal memuat tabel');
        schemaInfo = data; tableSelect.replaceChildren();
        data.tables.forEach(t => tableSelect.add(new Option(`${t.name} (${t.type.toLowerCase()})`, t.name)));
        status.textContent = `${data.tables.length} tabel/view pada schema ${data.selected_schema}.`;
        if (data.tables.length) { tableSelect.value = data.tables[0].name; await showTable(); }
        else { metadata.replaceChildren(el('p', 'Tidak ada tabel pada schema ini.')); dataArea.replaceChildren(); summary.textContent = ''; }
      } catch (e) { status.textContent = e.message; }
    }
    function makeTable(headers, rows) {
      const t = el('table'); const thead = el('thead'), hr = el('tr');
      headers.forEach(h => hr.append(el('th', h))); thead.append(hr); t.append(thead);
      const tbody = el('tbody');
      rows.forEach(row => { const tr = el('tr'); row.forEach(v => tr.append(el('td', v === null ? 'NULL' : (typeof v === 'object' ? JSON.stringify(v) : v)))); tbody.append(tr); });
      t.append(tbody); return t;
    }
    async function showTable() {
      currentTable = tableSelect.value; offset = 0;
      if (!currentTable) return;
      const t = (schemaInfo.tables || []).find(x => x.name === currentTable);
      metadata.replaceChildren();
      if (t) {
        metadata.append(el('h3', `${t.name} | ${t.type}`));
        metadata.append(el('h4', 'Kolom'));
        metadata.append(makeTable(['Nama', 'Tipe', 'Nullable', 'Default', 'Urutan'], t.columns.map(c => [c.name, c.type, c.nullable ? 'Ya' : 'Tidak', c.default || '—', c.ordinal])));
        metadata.append(el('h4', 'Constraint'));
        metadata.append(t.constraints.length ? makeTable(['Nama', 'Tipe', 'Definisi'], t.constraints.map(c => [c.name, c.type, c.definition])) : el('p', 'Tidak ada constraint.'));
        metadata.append(el('h4', 'Index'));
        metadata.append(t.indexes.length ? makeTable(['Nama', 'Definisi'], t.indexes.map(i => [i.name, i.definition])) : el('p', 'Tidak ada index.'));
      }
      await loadData();
    }
    async function loadData() {
      try {
        const res = await fetch(`/api/databases/${dbID}/tables/${encodeURIComponent(currentTable)}/data?schema=${encodeURIComponent(schemaSelect.value)}&limit=${limit}&offset=${offset}`);
        const data = await res.json(); if (!res.ok) throw new Error(data.message || data.error || 'Gagal memuat data');
        total = data.total; dataArea.replaceChildren(makeTable(data.columns, data.rows));
        summary.textContent = `Menampilkan ${data.rows.length ? offset + 1 : 0}–${offset + data.rows.length} dari ${total} baris`;
        document.getElementById('prevPage').disabled = offset === 0;
        document.getElementById('nextPage').disabled = offset + limit >= total;
      } catch (e) { dataArea.replaceChildren(el('p', e.message)); }
    }
    schemaSelect.addEventListener('change', loadTables);
    document.getElementById('loadTable').addEventListener('click', showTable);
    document.getElementById('prevPage').addEventListener('click', () => { offset = Math.max(0, offset - limit); loadData(); });
    document.getElementById('nextPage').addEventListener('click', () => { if (offset + limit < total) { offset += limit; loadData(); } });
    loadSchema();
  })();
</script>
{{end}}

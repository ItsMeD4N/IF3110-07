{{define "title"}}Masuk{{end}}
{{define "content"}}
<section class="card form-card narrow">
  <h1>Masuk</h1>
  <p class="muted">Pakai akun yang dibuatkan Platform Admin.</p>
  <form method="post" action="/login" class="form" autocomplete="on">
    {{.CSRFField}}
    {{if .Data}}{{with .Data.Error}}<div class="alert alert-error" role="alert">{{.}}</div>{{end}}{{end}}
    <label>Username
      <input name="username" value="{{if .Data}}{{.Data.Username}}{{end}}" autocomplete="username" required autofocus spellcheck="false">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <div class="form-actions">
      <button class="btn btn-primary btn-block" type="submit">Masuk</button>
    </div>
  </form>
</section>
{{end}}
